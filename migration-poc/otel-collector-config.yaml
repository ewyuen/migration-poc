receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s
  batch:

exporters:
  otlp_http/langfuse:
    endpoint: http://host.docker.internal:3000/api/public/otel
    headers:
      Authorization: "Basic ${LANGFUSE_AUTH_STRING}"
      x-langfuse-ingestion-version: "4"
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/langfuse, debug]